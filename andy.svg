      <path d="M18.5 28c7-5.5 20.5-6.5 28-1" fill="none" stroke="#f7dcae" stroke-width="2.4" stroke-linecap="round"/>
      <g fill="#fdf6ea" opacity=".85"><circle cx="14" cy="38" r="1.1"/><circle cx="49" cy="36" r="1.2"/><circle cx="41" cy="22.5" r="1"/></g>
